<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="E-commerce Platforms">
  <defs>
    <linearGradient id="ecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2d5c"/>
      <stop offset="55%" stop-color="#1d4f91"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ecom-bg)"/>

  <g opacity="0.12">
    <circle cx="220" cy="180" r="120" fill="#ffffff"/>
    <circle cx="1380" cy="720" r="160" fill="#ffffff"/>
  </g>

  <g>
    <rect x="180" y="170" width="420" height="180" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <image href="logos/wordpress.svg" x="230" y="220" width="320" height="80" preserveAspectRatio="xMidYMid meet"/>

    <rect x="640" y="170" width="420" height="180" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <image href="logos/woocommerce.svg" x="690" y="220" width="320" height="80" preserveAspectRatio="xMidYMid meet"/>

    <rect x="1100" y="170" width="320" height="180" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <image href="logos/shopify.svg" x="1130" y="220" width="260" height="80" preserveAspectRatio="xMidYMid meet"/>

    <rect x="280" y="430" width="420" height="180" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <image href="logos/magento.svg" x="300" y="470" width="380" height="100" preserveAspectRatio="xMidYMid meet"/>

    <rect x="760" y="430" width="420" height="180" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <image href="logos/prestashop.svg" x="810" y="480" width="320" height="80" preserveAspectRatio="xMidYMid meet"/>

    <rect x="1240" y="430" width="180" height="180" rx="20" fill="#ffffff" fill-opacity="0.95"/>
    <text x="1330" y="535" text-anchor="middle" fill="#1d4f91" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900">CRM</text>
  </g>
</svg>
